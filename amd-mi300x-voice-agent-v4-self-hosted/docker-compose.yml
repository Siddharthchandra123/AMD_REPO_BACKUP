services:
  api:
    build: ./services/api
    environment:
      VLLM_BASE_URL: http://llm:8000/v1
      QDRANT_URL: http://qdrant:6333
      ASR_PROVIDER_URL: http://asr:9000
      TTS_PROVIDER_URL: http://tts:9001
    ports:
    - 8000:8000
    depends_on:
    - qdrant
    - asr
    - tts
    restart: unless-stopped
  llm:
    image: vllm/vllm-openai-rocm:latest
    profiles:
    - gpu
    devices:
    - /dev/kfd
    - /dev/dri
    group_add:
    - video
    ipc: host
    cap_add:
    - SYS_PTRACE
    security_opt:
    - seccomp=unconfined
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
    - --model
    - ${VLLM_MODEL:-Qwen/Qwen2.5-3B-Instruct}
    - --host
    - 0.0.0.0
    - --port
    - '8000'
    ports:
    - 8001:8000
    volumes:
    - hf_cache:/root/.cache/huggingface
    restart: unless-stopped
  asr:
    build: ./services/asr
    ports:
    - 9000:9000
    restart: unless-stopped
  tts:
    build: ./services/tts
    ports:
    - 9001:9001
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    ports:
    - 6333:6333
    volumes:
    - qdrant_data:/qdrant/storage
    restart: unless-stopped
  web:
    build:
      context: ./services/web
      dockerfile: Dockerfile
    ports:
    - 8080:80
    depends_on:
    - api
  main:
    # Control-plane/readiness container. Compose starts dependencies;
    # this service does not need Docker socket or privileged access.
    image: python:3.12-alpine
    profiles:
      - gpu
    depends_on:
      - llm
      - asr
      - tts
      - qdrant
      - api
      - web
    volumes:
      - ./scripts/stack_main.py:/app/stack_main.py:ro
    command: ["python", "-u", "/app/stack_main.py"]
    environment:
      STACK_INTERVAL_SECONDS: "15"
      STACK_REQUEST_TIMEOUT_SECONDS: "5"
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test: ["CMD", "python", "-c", "from pathlib import Path; assert Path('/tmp/voice-agent-stack-ready').exists()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15m
    restart: unless-stopped
volumes:
  hf_cache: null
  qdrant_data: null
